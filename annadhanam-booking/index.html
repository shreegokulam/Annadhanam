<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&family=Barlow+Semi+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Annadhanam Booking · Dubai Ayyappa Samaj</title>
<style>
:root{--y:#ffe01a;--o:#f7941d;--bg:#050505;--card:#12100c;--card2:#1b1710;--ink:#fff;--mut:#b9ad94;--line:#3a2c12;--g:#f7941d;--g2:#2b1f08;--amb:#ffb454}
*{box-sizing:border-box}
html{background:#000}
body{margin:0;font:16px/1.4 "Barlow Semi Condensed","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(ellipse at 50% 0,#1a1206 0,#050505 55%) #050505;color:var(--ink);-webkit-tap-highlight-color:transparent;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px;position:relative}
.wrap.wide{max-width:1000px}
h1{font:700 24px/1.15 "Arvo",Georgia,serif;color:var(--y);margin:6px 0 2px}
h2{font-size:18px;margin:0 0 8px;color:var(--y)}
.sub,.mut{color:var(--mut)}.sub{margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-weight:600;margin:14px 0 6px;color:#fff}
input,select{width:100%;font:inherit;padding:12px;border:1px solid #5a4620;border-radius:10px;background:#1a1611;color:#fff}
input::placeholder{color:#7d725c}
input:focus,select:focus{outline:2px solid var(--o);outline-offset:0}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffa63a,#f7941d);color:#1a0f00;font-weight:800;letter-spacing:.02em;text-align:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--y);border:1.5px solid #8a6a1f}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{border:1.5px solid var(--line);background:var(--card2);border-radius:12px;padding:12px;text-align:left;color:#fff}
.slot b{font-size:20px;display:block;color:var(--y)}.slot small{color:var(--mut)}
.slot.sel{border-color:var(--o);background:var(--g2);box-shadow:0 0 0 1px var(--o) inset}
.slot:disabled{opacity:.4;cursor:not-allowed}
.slot.low small{color:var(--amb);font-weight:700}
.bar{height:6px;background:#2a2112;border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--y))}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1.5px solid var(--line);background:var(--card2);border-radius:10px;font-weight:800;color:#fff}
.seg button.sel{border-color:var(--o);background:var(--g2);color:var(--y)}
.err{background:#3a1512;color:#ffb4a8;padding:10px 12px;border-radius:10px;margin:10px 0}
.note{background:#2f2308;color:#ffd88a;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.okbox{background:#12301f;color:#9be3b6;padding:10px 12px;border-radius:10px;margin:10px 0}
a{color:var(--y)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#2a2112;color:var(--mut);white-space:nowrap}
.tag.ok{background:#12301f;color:#9be3b6}.tag.bad{background:#3a1512;color:#ffb4a8}
canvas.ticket{width:100%;max-width:400px;display:block;margin:8px auto;border-radius:14px;border:1px solid #8a6a1f;background:#000}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:10px;border:1.5px solid var(--line);background:var(--card2);border-radius:10px;font-weight:800;color:#fff}
.tabs button.sel{background:var(--o);color:#1a0f00;border-color:var(--o)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:28px;color:var(--y)}.stat span{font-size:12px;color:var(--mut)}
/* ---- invitation-style header ---- */
.garland{height:30px;margin:-16px -16px 6px;background:radial-gradient(circle at 50% 50%,#ffc21a 0 38%,#f26b1d 40% 68%,transparent 70%) 0 0/24px 24px repeat-x,linear-gradient(#000,transparent);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
@media(min-width:760px){body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:22px;background:radial-gradient(circle at 50% 50%,#ffc21a 0 38%,#f26b1d 40% 68%,transparent 70%) 0 0/22px 22px repeat-y;opacity:.9}body::before{left:calc(50% - 330px)}body::after{right:calc(50% - 330px)}body.dark::before,body.dark::after{display:none}}
.hero{text-align:center;padding:2px 0 6px}
.hero .logo{width:62px;height:62px;border-radius:50%;box-shadow:0 0 18px rgba(247,148,29,.55)}
.hero .das{font:700 46px/1 "Arvo",Georgia,serif;letter-spacing:.04em;color:#fff;margin:6px 0 0}
.hero .org{font:700 27px/1.05 "Arvo",Georgia,serif;color:var(--y);letter-spacing:.01em}
.hero .yr{font:700 17px/1.2 "Arvo",Georgia,serif;color:#fff;margin-top:6px}
.hero .yr sup{font-size:.6em}
.hero .deity{display:block;width:44%;max-width:170px;margin:6px auto 0;-webkit-mask-image:radial-gradient(ellipse at 50% 46%,#000 52%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 46%,#000 52%,transparent 78%)}
.hero.compact .deity{display:none}.hero.compact .das{font-size:34px}.hero.compact .org{font-size:20px}.hero.compact .yr{font-size:13px}.hero.compact .logo{width:48px;height:48px}
.pill{display:inline-block;background:var(--o);color:#fff;font-weight:800;font-size:19px;border-radius:0 30px 30px 0;padding:7px 22px 7px 16px;margin:2px 0 8px -16px}
.evt{background:linear-gradient(180deg,#1d1404,#100c04);border:1px solid #8a6a1f;border-radius:14px;padding:12px 14px;margin:8px 0;text-align:center}
.evt b{display:block;color:var(--y);font-size:20px;font-family:"Arvo",Georgia,serif}
.evt span{color:#e9dcc0}
details.card summary{cursor:pointer;font-weight:800;color:var(--y)}
.prog{display:grid;grid-template-columns:78px 1fr;gap:5px 10px;margin-top:10px;font-size:15px}
.prog i{font-style:normal;font-weight:700;color:var(--y)}
.prog .hl{color:#fff;font-weight:800;background:#2b1f08;border-radius:6px;padding:0 6px}
.foot{text-align:center;margin-top:22px;color:var(--o);font-weight:800;letter-spacing:.03em;font-size:15px}
.foot a{color:var(--mut);font-weight:500;font-size:13px;text-decoration:none;margin:0 6px}
/* scanner */
body.dark{background:#000}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
video{width:100%;border-radius:14px;background:#000;max-height:34vh;object-fit:cover;display:block;border:1px solid var(--line)}
.res{border-radius:16px;padding:16px;margin:12px 0;min-height:170px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.res.idle{background:var(--card);color:var(--mut);border:1px solid var(--line)}.res.ok{background:#1e9e5a;color:#fff}.res.bad{background:#c0392b;color:#fff}.res.warn{background:#d98a00;color:#fff}
.res .lbl{font-weight:800;letter-spacing:.06em;font-size:15px;opacity:.95}
.res .big{font-size:28px;font-weight:800;line-height:1.15;margin:6px 0}
.res .n{font-size:68px;font-weight:900;line-height:1}
.res .adj{margin-top:10px;font-size:14px}
.res .adj button,.res .go{margin:3px;min-width:38px;padding:7px 10px;border-radius:8px;border:0;font-weight:800;background:rgba(255,255,255,.92);color:#1b1f1d}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.demo{background:#2f2308;color:#ffd88a;padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
</style>
</head>

/* ---------------- API ---------------- */
async function rpc(fn, args = {}, opt = {}) {
  if (DEMO) return demo[fn](args);
  const key = CONFIG.SUPABASE_KEY;
  const headers = {'apikey': key, 'Content-Type': 'application/json'};
  if (key.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + key;
  const ctl = new AbortController();
  const t = opt.timeout ? setTimeout(() => ctl.abort(), opt.timeout) : null;
  let r;
  try {
    r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers, body: JSON.stringify(args), signal: ctl.signal});
  } catch (e) {
    const err = new Error('offline'); err.offline = true; throw err;
  } finally { if (t) clearTimeout(t); }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'error');
  return j;
}
async function getInfo() {
  try { const i = await rpc('get_public_info'); localStorage.setItem('lq_info', JSON.stringify(i)); return i; }
  catch (e) { const c = localStorage.getItem('lq_info'); if (c) return JSON.parse(c); throw e; }
}

/* ---------------- Demo backend (same interface as the database functions) ---------------- */
const demo = (() => {
  const K = 'lq_demo_v1';
  const D = () => JSON.parse(localStorage.getItem(K) || 'null') || {s:{event_title:'Annadhanam (Lunch Prasadam)',event_date:'2026-12-20',slot_cap:'250',max_per_phone:'2',booking_open:'true',staff_pin:'1234',admin_pin:'9999'}, b:[]};
  const W = d => localStorage.setItem(K, JSON.stringify(d));
  const pk = p => String(p||'').replace(/\D/g,'').slice(-9);
  const E = m => { throw new Error(m); };
  const staff = (d,p) => { if (p !== d.s.staff_pin && p !== d.s.admin_pin) E('bad_pin'); };
  const admin = (d,p) => { if (p !== d.s.admin_pin) E('bad_pin'); };
  const gen = d => { const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c; do { c=''; for (let i=0;i<8;i++) c+=a[Math.floor(Math.random()*a.length)]; } while (d.b.some(x=>x.code===c)); return c; };
  const booked = (d,s) => d.b.filter(x=>x.slot===s && !x.cancelled).reduce((a,x)=>a+x.party_size,0);
  const make = (d,n,ph,slot,size,walk) => {
    n = (n||'').trim(); if (n.length < 2) E('name_required');
    let k = pk(ph); if (k.length < 7) { if (walk) k = 'walkin'; else E('phone_invalid'); }
    if (!SLOTS.includes(slot)) E('slot_invalid');
    if (!(size >= 1 && size <= 4)) E('size_invalid');
    if (booked(d,slot) + size > +d.s.slot_cap) E('slot_full');
    if (!walk && d.b.filter(x=>x.phone_key===k && !x.cancelled && !x.walk_in).length >= +d.s.max_per_phone) E('phone_limit');
    const b = {code:gen(d), name:n.slice(0,60), phone:String(ph||'-').slice(0,20), phone_key:k, slot, party_size:size,
      checked_in: walk?size:0, checked_in_at: walk?new Date().toISOString():null, walk_in:walk, cancelled:false, created_at:new Date().toISOString()};
    d.b.unshift(b); W(d); return b;
  };
  const find = (d,c) => d.b.find(x => x.code === String(c||'').trim().toUpperCase());
  return {
    get_public_info(){ const d=D(); return {title:d.s.event_title,date:d.s.event_date,open:d.s.booking_open==='true',cap:+d.s.slot_cap,slots:SLOTS.map(s=>({slot:s,booked:booked(d,s)}))}; },
    book(a){ const d=D(); if (d.s.booking_open!=='true') E('closed'); return make(d,a.p_name,a.p_phone,a.p_slot,a.p_size,false); },
    get_ticket(a){ return find(D(),a.p_code) || null; },
    find_bookings(a){ const d=D(), k=pk(a.p_phone), n=String(a.p_name||'').trim().toLowerCase(); if (k.length<7||n.length<2) return []; return d.b.filter(x=>x.phone_key===k && !x.cancelled && x.name.toLowerCase().includes(n)); },
    staff_list(a){ const d=D(); staff(d,a.p_pin); return d.b; },
    staff_search(a){ const d=D(); staff(d,a.p_pin); const q=String(a.p_q||'').trim(), dg=q.replace(/\D/g,''); return d.b.filter(x=>!x.cancelled && (x.code===q.toUpperCase() || (dg.length>=4 && x.phone_key.includes(dg)) || (q.length>=2 && x.name.toLowerCase().includes(q.toLowerCase())))).slice(0,20); },
    staff_check_in(a){ const d=D(); staff(d,a.p_pin); const b=find(d,a.p_code); if(!b) return {status:'not_found'}; if(b.cancelled) return {status:'cancelled',booking:b}; if(b.checked_in>=b.party_size) return {status:'already',booking:b}; const prev=b.checked_in; b.checked_in=b.party_size; b.checked_in_at=new Date().toISOString(); W(d); return {status:'ok',previous:prev,booking:b}; },
    staff_set_checked_in(a){ const d=D(); staff(d,a.p_pin); const b=find(d,a.p_code); if(!b) E('not_found'); b.checked_in=Math.min(Math.max(a.p_n,0),b.party_size); b.checked_in_at=a.p_n>0?new Date().toISOString():null; W(d); return b; },
    staff_walkin(a){ const d=D(); staff(d,a.p_pin); return make(d,(a.p_name||'').trim()||'Walk-in',a.p_phone,a.p_slot,a.p_size,true); },
    admin_get_settings(a){ const d=D(); admin(d,a.p_pin); return d.s; },
    admin_set_settings(a){ const d=D(); admin(d,a.p_pin); for (const [k,v] of Object.entries(a.p_settings)) { if (!(k in d.s)) continue; if ((k==='slot_cap'||k==='max_per_phone') && !/^\d{1,4}$/.test(v)) E('invalid_'+k); if ((k==='staff_pin'||k==='admin_pin') && String(v).length<4) E('pin_short'); d.s[k]=String(v); } W(d); return d.s; },
    admin_cancel(a){ const d=D(); admin(d,a.p_pin); const b=find(d,a.p_code); if(!b) E('not_found'); b.cancelled=a.p_cancel; W(d); return b; }
  };
})();

/* ---------------- Router ---------------- */
let cleanup = null;
function route() {
  if (cleanup) { try { cleanup(); } catch(e){} cleanup = null; }
  const h = location.hash || '#/';
  document.body.classList.toggle('dark', h.startsWith('#/scan'));
  const app = $('#app'); window.scrollTo(0,0);
  if (h.startsWith('#/t/')) viewTicket(app, decodeURIComponent(h.slice(4)).toUpperCase());
  else if (h === '#/find') viewFind(app);
  else if (h.startsWith('#/scan')) viewScan(app);
  else if (h.startsWith('#/admin')) viewAdmin(app);
  else viewBook(app);
}
addEventListener('hashchange', route);

async function viewBook(app) {
  app.innerHTML = '<div class="wrap"><p class="sub">Loading…</p></div>';
  let info;
  try { info = await getInfo(); } catch (e) { app.innerHTML = `<div class="wrap"><div class="err">${esc(errMsg(e))}</div></div>`; return; }
  const mine = JSON.parse(localStorage.getItem('lq_tickets') || '[]');
  let slot = null, size = 1;
  app.innerHTML = `<div class="wrap">${hero(false)}${demoBanner()}
    <div class="evt"><b>${esc(info.title)}</b><span>${esc(fmtDate(info.date))}${info.date ? ' · ' : ''}${esc(CONFIG.VENUE)}</span></div>
    <div class="pill">Book your Annadhanam time</div>
    ${mine.length ? `<div class="card"><b>Your bookings:</b> ${mine.map(c => `<a href="#/t/${esc(c)}">${esc(c)}</a>`).join(' · ')}</div>` : ''}
    ${info.open ? '' : '<div class="err">Bookings are closed.</div>'}
    <div class="card">
      <label style="margin-top:0">1. Pick a time</label><div class="slots" id="slots"></div>
      <label>2. How many people? (max 4)</label><div class="seg" id="seg"></div>
      <label for="nm">3. Your name</label><input id="nm" autocomplete="name" maxlength="60">
      <label for="ph">Phone number</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20">
      <div id="msg"></div>
      <button class="btn" id="go" style="margin-top:14px" ${info.open ? '' : 'disabled'}>Book my slot</button>
    </div>
    <details class="card"><summary>Programme on Sunday, 20th December</summary><div class="prog">${PROGRAMME.map(([t, x]) => `<i>${t}</i><span class="${/Annadhanam/.test(x) ? 'hl' : ''}">${esc(x)}</span>`).join('')}</div></details>
    <p class="sub" style="text-align:center"><a href="#/find">Already booked? Find my booking</a></p>${footer()}</div>`;
  const left = s => { const x = info.slots.find(z => z.slot === s); return info.cap - (x ? x.booked : 0); };
  function drawSlots() {
    if (slot && left(slot) < size) slot = null;
    $('#slots').innerHTML = info.slots.map(x => {
      const l = left(x.slot), full = l < size, low = l > 0 && l <= Math.ceil(info.cap * 0.1);
      return `<button class="slot ${slot===x.slot?'sel':''} ${low?'low':''}" data-s="${x.slot}" ${full?'disabled':''}>
        <b>${fmtSlot(x.slot)}</b><small>${l < 1 ? 'Full' : (low ? 'Only ' + l + ' left' : l + ' spots left')}</small>
        <div class="bar"><i style="width:${Math.min(100, Math.round(x.booked / info.cap * 100))}%"></i></div></button>`;
    }).join('');
    document.querySelectorAll('.slot').forEach(b => b.onclick = () => { slot = b.dataset.s; drawSlots(); });
    $('#seg').innerHTML = [1,2,3,4].map(n => `<button data-n="${n}" class="${size===n?'sel':''}">${n}</button>`).join('');
    document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { size = +b.dataset.n; drawSlots(); });
  }
  drawSlots();
  $('#go').onclick = async () => {
    const msg = $('#msg'), name = $('#nm').value.trim(), phone = $('#ph').value.trim();
    msg.innerHTML = '';
    if (!slot) return msg.innerHTML = '<div class="err">Please pick a time slot.</div>';
    if (name.length < 2) return msg.innerHTML = '<div class="err">Please enter your name.</div>';
    if (phone.replace(/\D/g,'').length < 7) return msg.innerHTML = '<div class="err">Please enter a valid phone number.</div>';
    const go = $('#go'); go.disabled = true; go.textContent = 'Booking…';
    try {
      const t = await rpc('book', {p_name: name, p_phone: phone, p_slot: slot, p_size: size});
      const list = JSON.parse(localStorage.getItem('lq_tickets') || '[]'); list.unshift(t.code);
      localStorage.setItem('lq_tickets', JSON.stringify([...new Set(list)]));
      location.hash = '#/t/' + t.code;
    } catch (e) {
      msg.innerHTML = `<div class="err">${esc(errMsg(e))}</div>`;
      go.disabled = false; go.textContent = 'Book my slot';
      if (e.message === 'slot_full') { try { info = await getInfo(); drawSlots(); } catch (_) {} }
    }
  };
  const iv = setInterval(async () => { try { info = await getInfo(); drawSlots(); } catch (_) {} }, 30000);
  cleanup = () => clearInterval(iv);
}

const logoImg = new Image(), logoReady = new Promise(r => { logoImg.onload = r; logoImg.onerror = r; });
logoImg.src = IMG_LOGO;
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
async function drawTicket(cv, t, info) {
  await logoReady;
  try { await Promise.all([document.fonts.load('700 30px Arvo'), document.fonts.load('800 22px "Barlow Semi Condensed"')]); } catch (_) {}
  const W = 640, H = 940; cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), S = 'Arvo,Georgia,serif', F = '"Barlow Semi Condensed","Segoe UI",system-ui,sans-serif';
  c.fillStyle = '#050505'; c.fillRect(0,0,W,H);
  for (let x = 12; x < W; x += 24) { c.fillStyle = '#f26b1d'; c.beginPath(); c.arc(x, 14, 11, 0, 7); c.fill(); c.fillStyle = '#ffc21a'; c.beginPath(); c.arc(x, 14, 7, 0, 7); c.fill(); }
  c.strokeStyle = '#b8892a'; c.lineWidth = 3; c.strokeRect(14, 36, W - 28, H - 50);
  c.textAlign = 'center';
  if (logoImg.naturalWidth) c.drawImage(logoImg, W/2 - 34, 52, 68, Math.round(68 * logoImg.naturalHeight / logoImg.naturalWidth));
  c.fillStyle = '#fff'; c.font = `700 40px ${S}`; c.fillText('D. A. S', W/2, 170);
  c.fillStyle = '#ffe01a'; c.font = `700 30px ${S}`; c.fillText('DUBAI AYYAPPA SAMAJ', W/2, 208);
  c.fillStyle = '#fff'; c.font = `700 17px ${S}`; c.fillText('55th YEAR MANDALA MASA CELEBRATIONS', W/2, 236);
  c.fillStyle = '#f7941d'; rr(c, W/2 - 175, 254, 350, 40, 20); c.fill();
  c.fillStyle = '#fff'; c.font = `800 22px ${F}`; c.fillText('ANNADHANAM ENTRY PASS', W/2, 282);
  const qr = qrcode(0,'M'); qr.addData('LQ:' + t.code); qr.make();
  const n = qr.getModuleCount(), cell = Math.floor(330 / (n + 6)), size = cell * (n + 6), ox = (W - size) / 2, oy = 316;
  c.fillStyle = '#fff'; rr(c, ox - 10, oy - 10, size + 20, size + 20, 14); c.fill();
  c.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (qr.isDark(r,q)) c.fillRect(ox + (q + 3) * cell, oy + (r + 3) * cell, cell, cell);
  let y = oy + size + 56;
  c.fillStyle = '#ffe01a'; c.font = `700 44px ${S}`; c.fillText(fmtSlot(t.slot), W/2, y);
  y += 34; c.fillStyle = '#e9dcc0'; c.font = `600 22px ${F}`; c.fillText(info.date ? fmtDate(info.date) : '', W/2, y);
  y += 46; c.fillStyle = '#fff'; c.font = `800 32px ${F}`; c.fillText(t.name.slice(0,26), W/2, y);
  y += 34; c.fillStyle = '#b9ad94'; c.font = `600 24px ${F}`; c.fillText(`${t.party_size} ${t.party_size > 1 ? 'guests' : 'guest'}`, W/2, y);
  y += 42; c.fillStyle = '#fff'; c.font = '700 28px ui-monospace,Menlo,monospace'; c.fillText(t.code.replace(/(.{4})/,'$1 '), W/2, y);
  c.fillStyle = '#b9ad94'; c.font = `500 18px ${F}`; c.fillText(CONFIG.VENUE, W/2, H - 44);
  c.fillStyle = '#f7941d'; c.font = `800 17px ${F}`; c.fillText('SARVA MANGALA DAYAKANE · SHARANAM AYYAPPA', W/2, H - 22);
}
function makeICS(t, info) {
  const d = info.date.replace(/-/g,''), [h,m] = t.slot.split(':').map(Number), end = h*60 + m + 30;
  const dt = (hh,mm) => `${d}T${pad(hh)}${pad(mm)}00`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LunchQueue//EN','BEGIN:VEVENT',
    `UID:${t.code}@lunchqueue`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,
    `DTSTART:${dt(h,m)}`, `DTEND:${dt(Math.floor(end/60), end%60)}`,
    `SUMMARY:${CONFIG.ORG} - ${info.title} (${fmtSlot(t.slot)})`, `LOCATION:${CONFIG.VENUE.replace(/,/g, '\\,')}`,
    `DESCRIPTION:Booking ${t.code} for ${t.party_size} guest(s). Show your QR at the entrance.`,
    'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Lunch in 1 hour','END:VALARM',
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Lunch tomorrow','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}

/* ---------------- PIN gate (staff + admin) ---------------- */
function pinGate(app, {title, hint, verify, onOk, back}) {
  app.innerHTML = `<div class="wrap">${hero(true)}${demoBanner()}<h1>${esc(title)}</h1><p class="sub">${esc(hint)}</p>
    <div class="card"><label style="margin-top:0" for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <div id="msg"></div><button class="btn" id="go" style="margin-top:14px">Continue</button></div>
    <a href="${back}">← Back</a></div>`;
  const go = async () => {
    const pin = $('#pin').value.trim(); if (!pin) return;
    $('#go').disabled = true; $('#msg').innerHTML = '';
    try { const data = await verify(pin); onOk(pin, data); }
    catch (e) { $('#msg').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; $('#go').disabled = false; }
  };
  $('#go').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#pin').focus();
}

/* ---------------- Staff: entrance scanner ---------------- */
function viewScan(app) {
  const stored = localStorage.getItem('lq_pin');
  const start = (pin, list) => { localStorage.setItem('lq_pin', pin); if (list) saveCache(list); runScanner(app, pin); };
  if (stored) {
    // verify quietly; falls back to cached session if offline
    rpc('staff_list', {p_pin: stored}).then(l => start(stored, l)).catch(e => {
      if (e.message === 'bad_pin') { localStorage.removeItem('lq_pin'); viewScan(app); } else start(stored, null);
    });
    app.innerHTML = '<div class="wrap"><p class="sub">Starting scanner…</p></div>';
    return;
  }
  pinGate(app, {title: 'Entrance scanner', hint: 'Staff PIN required.', back: '#/', verify: pin => rpc('staff_list', {p_pin: pin}).then(l => ({pin, l})), onOk: (pin, d) => start(pin, d.l)});
}
function saveCache(list) { localStorage.setItem('lq_cache', JSON.stringify({t: Date.now(), list})); }
function loadCache() { try { return JSON.parse(localStorage.getItem('lq_cache') || '{"list":[]}'); } catch (_) { return {list: []}; } }
const getPending = () => { try { return JSON.parse(localStorage.getItem('lq_pending') || '[]'); } catch (_) { return []; } };
const setPending = p => localStorage.setItem('lq_pending', JSON.stringify(p));

function runScanner(app, pin) {
  let cache = loadCache(), idx = new Map(), online = true, syncing = false, stream = null, facing = 'environment', busy = false, last = {txt:'', t:0};
  const rebuild = () => { idx = new Map(cache.list.map(b => [b.code, b])); };
  rebuild();
  let actx = null; try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  app.innerHTML = `<div class="wrap">
    <div class="top"><b>Entry scanner</b><span class="mut" id="stat" style="font-size:13px"></span></div>
    <video id="vid" playsinline muted></video>
    <div id="res" class="res idle"><div class="big">Ready to scan</div><div>Point the camera at the guest’s QR</div></div>
    <div class="row"><button class="btn sec" id="bS">Search</button><button class="btn sec" id="bW">Walk-in</button><button class="btn sec" id="bC">Flip camera</button></div>
    <div id="panel"></div><div id="toast" class="mut" style="text-align:center;margin-top:8px;min-height:20px"></div>
    <p class="mut" style="text-align:center;margin-top:18px"><a href="#/" id="out">Sign out</a></p></div>`;
  const flash = m => { $('#toast').textContent = m; setTimeout(() => { if ($('#toast')) $('#toast').textContent = ''; }, 3500); };
  const updStat = () => { const el = $('#stat'); if (!el) return; const p = getPending().length; el.textContent = `${online ? '● online' : '○ offline'} · ${cache.list.length} cached${p ? ' · ' + p + ' to sync' : ''}`; el.style.color = online ? '#8fd4ae' : '#ffb454'; };
  updStat();

  function beep(ok) {
    try { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [120,60,120]);
      if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination);
      o.frequency.value = ok ? 880 : 220; g.gain.value = 0.15; o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.35)); } catch (_) {}
  }
  const show = (kind, html, after) => { const r = $('#res'); if (!r) return; r.className = 'res ' + kind; r.innerHTML = html; if (after) after(r); };
  const upsert = b => { if (!b) return; const i = cache.list.findIndex(x => x.code === b.code); if (i >= 0) cache.list[i] = {...cache.list[i], ...b}; else cache.list.unshift(b); rebuild(); saveCache(cache.list); };

  function render(r, offline) {
    const b = r.booking;
    if (r.status === 'ok') {
      beep(true);
      const now = b.party_size - (r.previous || 0);
      show('ok', `<div class="lbl">ADMIT${offline ? ' (OFFLINE)' : ''}</div><div class="n">${now}</div>
        <div class="big">${esc(b.name)}</div><div>${now > 1 ? 'guests' : 'guest'} · ${fmtSlot(b.slot)}${r.previous ? ' · ' + r.previous + ' already inside' : ''}</div>
        ${b.party_size > 1 ? `<div class="adj">Fewer arrived? People inside: ${[...Array(b.party_size + 1).keys()].map(i => `<button data-n="${i}">${i}</button>`).join('')}</div>` : ''}`,
        el => el.querySelectorAll('[data-n]').forEach(x => x.onclick = async () => {
          try { const nb = await rpc('staff_set_checked_in', {p_pin: pin, p_code: b.code, p_n: +x.dataset.n}); upsert(nb); flash(`Set to ${nb.checked_in} of ${nb.party_size} inside`); }
          catch (e) { flash(e.offline ? 'Needs a connection to adjust' : errMsg(e)); } }));
    } else if (r.status === 'already') {
      beep(false);
      show('bad', `<div class="lbl">ALREADY ENTERED</div><div class="big">${esc(b.name)}</div><div>${b.party_size} guest${b.party_size > 1 ? 's' : ''} · in at ${esc(fmtTime(b.checked_in_at))}</div>`);
    } else if (r.status === 'cancelled') {
      beep(false); show('bad', `<div class="lbl">CANCELLED</div><div class="big">${esc(b.name)}</div><div>This booking was cancelled.</div>`);
    } else {
      beep(false); show('bad', `<div class="lbl">NOT FOUND</div><div class="big">Invalid ticket</div><div>Send to the help desk</div>`);
    }
    updStat();
  }
  function windowState(slot) {
    let info; try { info = JSON.parse(localStorage.getItem('lq_info') || 'null'); } catch (_) {}
    if (!info || !info.date) return null;
    const n = new Date(); if (info.date !== `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`) return null;
    const [h,m] = slot.split(':').map(Number), s = h*60 + m, cur = n.getHours()*60 + n.getMinutes();
    if (cur < s - CONFIG.GRACE_BEFORE_MIN) return {kind:'EARLY', mins: s - cur};
    if (cur > s + CONFIG.GRACE_AFTER_MIN) return {kind:'LATE', mins: cur - s};
    return null;
  }
  function offlineAdmit(code) {
    const b = idx.get(code);
    if (!b) return {status: 'not_found'};
    if (b.cancelled) return {status: 'cancelled', booking: b};
    if (b.checked_in >= b.party_size) return {status: 'already', booking: b};
    const prev = b.checked_in; b.checked_in = b.party_size; b.checked_in_at = new Date().toISOString(); saveCache(cache.list);
    const p = getPending(); p.push({code, at: Date.now()}); setPending(p);
    return {status: 'ok', previous: prev, booking: b};
  }
  async function admit(code, force) {
    code = code.toUpperCase().trim();
    const c = idx.get(code);
    if (c && !force && !c.cancelled && c.checked_in < c.party_size) {
      const w = windowState(c.slot);
      if (w) {
        beep(false);
        show('warn', `<div class="lbl">${w.kind} · ${w.mins} MIN</div><div class="big">${esc(c.name)}</div><div>Booked for ${fmtSlot(c.slot)} · ${c.party_size} guest${c.party_size > 1 ? 's' : ''}</div>
          <div style="margin-top:10px"><button class="go">Admit anyway</button></div>`, el => el.querySelector('.go').onclick = () => admit(code, true));
        return;
      }
    }
    let r, off = false;
    try { r = await rpc('staff_check_in', {p_pin: pin, p_code: code}, {timeout: 3500}); online = true; if (r.booking) upsert(r.booking); }
    catch (e) {
      if (e.message === 'bad_pin') { localStorage.removeItem('lq_pin'); location.hash = '#/scan'; route(); return; }
      if (!e.offline) { show('bad', `<div class="lbl">ERROR</div><div class="big">${esc(errMsg(e))}</div>`); return; }
      online = false; off = true; r = offlineAdmit(code);
    }
    render(r, off);
  }
  function onText(txt) {
    const now = Date.now(); if (txt === last.txt && now - last.t < 4000) return; last = {txt, t: now};
    const m = txt.trim().match(/^(?:LQ:)?([A-Z0-9]{8})$/i);
    if (!m) { beep(false); show('bad', '<div class="lbl">NOT A LUNCH TICKET</div><div class="big">Unknown QR</div>'); return; }
    admit(m[1]);
  }

  // ---- camera loop ----
  const vid = $('#vid'), cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
  let bd = null; try { if ('BarcodeDetector' in window) bd = new BarcodeDetector({formats: ['qr_code']}); } catch (_) {}
  async function cam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: facing}, width: {ideal: 1280}}, audio: false});
      vid.srcObject = stream; await vid.play();
    } catch (e) { vid.style.display = 'none'; flash('Camera unavailable — use Search to admit guests.'); }
  }
  async function tick() {
    if (busy || !vid.videoWidth) return; busy = true;
    try {
      let txt = null;
      if (bd) { const r = await bd.detect(vid); if (r.length) txt = r[0].rawValue; }
      else { const w = 480, h = Math.round(vid.videoHeight * w / vid.videoWidth); cv.width = w; cv.height = h; cx.drawImage(vid, 0, 0, w, h);
        const d = cx.getImageData(0, 0, w, h), q = jsQR(d.data, w, h, {inversionAttempts: 'dontInvert'}); if (q) txt = q.data; }
      if (txt) onText(txt);
    } catch (_) {}
    busy = false;
  }
  cam(); const tk = setInterval(tick, 120);
  $('#bC').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; cam(); };

  // ---- sync ----
  async function sync() {
    if (syncing) return; syncing = true;
    try {
      let p = getPending();
      while (p.length) { await rpc('staff_check_in', {p_pin: pin, p_code: p[0].code}, {timeout: 8000}); p = getPending(); p.shift(); setPending(p); }
      const list = await rpc('staff_list', {p_pin: pin}, {timeout: 15000}); cache.list = list; rebuild(); saveCache(list); online = true;
    } catch (e) { if (e.offline) online = false; else if (e.message === 'bad_pin') { localStorage.removeItem('lq_pin'); location.hash = '#/scan'; route(); } }
    syncing = false; updStat();
  }
  const si = setInterval(sync, 45000), onl = () => sync();
  addEventListener('online', onl); sync();
  cleanup = () => { clearInterval(tk); clearInterval(si); removeEventListener('online', onl); if (stream) stream.getTracks().forEach(t => t.stop()); };
  $('#out').onclick = () => { localStorage.removeItem('lq_pin'); };

  // ---- search panel ----
  $('#bS').onclick = () => {
    const p = $('#panel'); p.innerHTML = `<div class="card"><input id="q" placeholder="Phone (last digits), name, or code" autocomplete="off"><div id="list"></div></div>`; $('#q').focus();
    const draw = rows => { $('#list').innerHTML = rows.length ? rows.map(b => `<div class="item"><div><b>${esc(b.name)}</b><br><span class="mut">${esc(b.phone)} · ${fmtSlot(b.slot)} · ${b.party_size} guest${b.party_size > 1 ? 's' : ''} · ${esc(b.code)}</span></div>
        ${b.cancelled ? '<span class="tag bad">Cancelled</span>' : b.checked_in >= b.party_size ? `<span class="tag ok">In ${esc(fmtTime(b.checked_in_at))}</span>` : `<button class="btn sm" data-c="${esc(b.code)}">Admit</button>`}</div>`).join('') : '<p class="mut">No matches.</p>';
      document.querySelectorAll('#list [data-c]').forEach(x => x.onclick = () => { $('#panel').innerHTML = ''; admit(x.dataset.c, true); }); };
    let tmr; $('#q').oninput = () => { clearTimeout(tmr); tmr = setTimeout(async () => {
      const q = $('#q').value.trim(); if (q.length < 2) return $('#list').innerHTML = '';
      const dg = q.replace(/\D/g,''), isPhone = dg.length >= 4 && dg.length === q.replace(/[\s+\-()]/g,'').length, ql = q.toLowerCase();
      let rows = cache.list.filter(b => (b.code === q.toUpperCase()) || (isPhone && String(b.phone).replace(/\D/g,'').includes(dg)) || (!isPhone && b.name.toLowerCase().includes(ql))).slice(0, 20);
      if (!rows.length && online) { try { rows = await rpc('staff_search', {p_pin: pin, p_q: q}); } catch (_) {} }
      draw(rows); }, 150); };
  };

  // ---- walk-in panel ----
  $('#bW').onclick = () => {
    const n = new Date(), cur = n.getHours() * 60 + n.getMinutes(); let best = SLOTS[0];
    for (const s of SLOTS) { const [h,m] = s.split(':').map(Number); if (cur >= h*60 + m - CONFIG.GRACE_BEFORE_MIN) best = s; }
    let size = 1;
    $('#panel').innerHTML = `<div class="card"><h2>Walk-in (no booking)</h2>
      <label style="margin-top:0">Name (optional)</label><input id="wn"><label>Phone (optional)</label><input id="wp" type="tel" inputmode="tel">
      <label>People</label><div class="seg" id="ws">${[1,2,3,4].map(i => `<button data-n="${i}" class="${i === 1 ? 'sel' : ''}">${i}</button>`).join('')}</div>
      <label>Slot</label><select id="wl">${SLOTS.map(s => `<option value="${s}" ${s === best ? 'selected' : ''}>${fmtSlot(s)}</option>`).join('')}</select>
      <button class="btn" id="wg" style="margin-top:14px">Register & admit</button></div>`;
    document.querySelectorAll('#ws button').forEach(b => b.onclick = () => { size = +b.dataset.n; document.querySelectorAll('#ws button').forEach(x => x.classList.toggle('sel', x === b)); });
    $('#wg').onclick = async () => {
      try { const b = await rpc('staff_walkin', {p_pin: pin, p_name: $('#wn').value, p_phone: $('#wp').value, p_slot: $('#wl').value, p_size: size}); upsert(b); $('#panel').innerHTML = '';
        render({status: 'ok', previous: 0, booking: b}); }
      catch (e) { flash(e.offline ? 'Walk-ins need a connection' : errMsg(e)); }
    };
  };
}

/* ---------------- Admin ---------------- */
function viewAdmin(app) {
  const stored = sessionStorage.getItem('lq_apin');
  const begin = pin => { sessionStorage.setItem('lq_apin', pin); runAdmin(app, pin); };
  if (stored) { rpc('admin_get_settings', {p_pin: stored}).then(() => begin(stored)).catch(() => { sessionStorage.removeItem('lq_apin'); viewAdmin(app); }); app.innerHTML = '<div class="wrap"><p class="sub">Loading…</p></div>'; return; }
  pinGate(app, {title: 'Admin', hint: 'Admin PIN required.', back: '#/', verify: pin => rpc('admin_get_settings', {p_pin: pin}), onOk: pin => begin(pin)});
}
async function runAdmin(app, pin) {
  let tab = 'dash', st = {}, list = [], q = '', sf = '', iv;
  const load = async () => { [st, list] = await Promise.all([rpc('admin_get_settings', {p_pin: pin}), rpc('staff_list', {p_pin: pin})]); };
  try { await load(); } catch (e) { app.innerHTML = `<div class="wrap"><div class="err">${esc(errMsg(e))}</div></div>`; return; }
  const base = location.origin + location.pathname;
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  app.innerHTML = `<div class="wrap wide">${demoBanner()}
    <div class="top"><h1 style="margin:0">Admin</h1><a href="#/" id="so">Sign out</a></div>
    <div class="tabs"><button data-t="dash">Dashboard</button><button data-t="list">Bookings</button><button data-t="set">Settings</button></div>
    <div id="body"></div></div>`;
  $('#so').onclick = () => sessionStorage.removeItem('lq_apin');
  const body = $('#body');
  function tabs() { document.querySelectorAll('.tabs button').forEach(b => { b.classList.toggle('sel', b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; paint(); }; }); }

  function dash() {
    const live = list.filter(b => !b.cancelled), cap = +st.slot_cap;
    const per = SLOTS.map(s => { const bs = live.filter(b => b.slot === s); return {s, people: sum(bs, b => b.party_size), bk: bs.length, inn: sum(bs, b => b.checked_in)}; });
    const tot = sum(per, p => p.people), inn = sum(per, p => p.inn), capAll = cap * SLOTS.length;
    body.innerHTML = `<div class="card stat"><div><b>${tot}</b><span>people booked</span></div><div><b>${inn}</b><span>checked in</span></div><div><b>${capAll}</b><span>total capacity</span></div></div>
      ${capAll < 2000 ? `<div class="note">Total capacity is ${capAll} (${cap} × ${SLOTS.length} slots). If you expect 2,000 people, raise the per-slot cap in Settings (about 340).</div>` : ''}
      <div class="card"><table><tr><th>Slot</th><th>Booked</th><th style="width:34%"></th><th>Bookings</th><th>In</th></tr>
      ${per.map(p => `<tr><td><b>${fmtSlot(p.s)}</b></td><td>${p.people}/${cap}</td><td><div class="bar"><i style="width:${Math.min(100, p.people / cap * 100)}%"></i></div></td><td>${p.bk}</td><td>${p.inn}</td></tr>`).join('')}</table></div>
      <div class="card"><h2>Links</h2><p class="mut" style="margin:4px 0">Guests: <b>${esc(base)}</b><br>Scanner (staff): <b>${esc(base)}#/scan</b><br>Admin: <b>${esc(base)}#/admin</b></p></div>`;
  }
  function rows() {
    const ql = q.trim().toLowerCase(), dg = q.replace(/\D/g, '');
    const r = list.filter(b => (!sf || b.slot === sf) && (!ql || b.name.toLowerCase().includes(ql) || b.code.toLowerCase() === ql || (dg.length >= 3 && String(b.phone).replace(/\D/g,'').includes(dg))));
    $('#rows').innerHTML = `<p class="mut">${r.length} booking${r.length === 1 ? '' : 's'}${r.length > 200 ? ' (showing first 200)' : ''}</p><table><tr><th>Code</th><th>Name</th><th>Phone</th><th>Slot</th><th>#</th><th>Status</th><th></th></tr>
      ${r.slice(0, 200).map(b => `<tr><td>${esc(b.code)}</td><td>${esc(b.name)}${b.walk_in ? ' <span class="tag">walk-in</span>' : ''}</td><td>${esc(b.phone)}</td><td>${fmtSlot(b.slot)}</td><td>${b.party_size}</td>
      <td>${b.cancelled ? '<span class="tag bad">cancelled</span>' : b.checked_in >= b.party_size ? '<span class="tag ok">in</span>' : b.checked_in ? `<span class="tag">${b.checked_in} in</span>` : '<span class="tag">waiting</span>'}</td>
      <td><button class="btn sec sm" data-c="${esc(b.code)}" data-x="${b.cancelled ? 0 : 1}">${b.cancelled ? 'Restore' : 'Cancel'}</button></td></tr>`).join('')}</table>`;
    document.querySelectorAll('#rows [data-c]').forEach(x => x.onclick = async () => {
      if (x.dataset.x === '1' && !confirm('Cancel this booking?')) return;
      try { await rpc('admin_cancel', {p_pin: pin, p_code: x.dataset.c, p_cancel: x.dataset.x === '1'}); await load(); rows(); } catch (e) { alert(errMsg(e)); } });
  }
  function bookings() {
    body.innerHTML = `<div class="card"><div class="row"><input id="sq" placeholder="Search name, phone or code" value="${esc(q)}" style="flex:2"><select id="ss"><option value="">All slots</option>${SLOTS.map(s => `<option value="${s}" ${sf === s ? 'selected' : ''}>${fmtSlot(s)}</option>`).join('')}</select>
      <button class="btn sec sm" id="csv" style="flex:0 0 auto">Export CSV</button></div><div id="rows" style="margin-top:10px;overflow-x:auto"></div></div>`;
    $('#sq').oninput = e => { q = e.target.value; rows(); }; $('#ss').onchange = e => { sf = e.target.value; rows(); };
    $('#csv').onclick = () => { const f = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const out = [['Code','Name','Phone','Slot','Guests','CheckedIn','Status','Created'].join(',')].concat(list.map(b => [b.code,b.name,b.phone,fmtSlot(b.slot),b.party_size,b.checked_in,b.cancelled ? 'cancelled' : b.checked_in >= b.party_size ? 'in' : 'waiting',b.created_at].map(f).join(',')));
      download(new Blob([out.join('\n')], {type: 'text/csv'}), 'lunch-bookings.csv'); };
    rows();
  }
  function settings() {
    body.innerHTML = `<div class="card"><label style="margin-top:0">Event title</label><input id="s1" value="${esc(st.event_title)}">
      <label>Event date</label><input id="s2" type="date" value="${esc(st.event_date)}">
      <div class="row"><div><label>People per slot (cap)</label><input id="s3" type="number" min="1" value="${esc(st.slot_cap)}"></div>
      <div><label>Bookings per phone number</label><input id="s4" type="number" min="1" value="${esc(st.max_per_phone)}"></div></div>
      <p class="mut" id="capnote" style="margin:6px 0 0"></p>
      <label>Bookings</label><select id="s5"><option value="true" ${st.booking_open === 'true' ? 'selected' : ''}>Open</option><option value="false" ${st.booking_open !== 'true' ? 'selected' : ''}>Closed</option></select>
      <div class="row"><div><label>Staff (scanner) PIN</label><input id="s6" value="${esc(st.staff_pin)}"></div><div><label>Admin PIN</label><input id="s7" value="${esc(st.admin_pin)}"></div></div>
      <div id="msg"></div><button class="btn" id="sv" style="margin-top:14px">Save settings</button></div>`;
    const cn = () => $('#capnote').textContent = `Total capacity: ${(+$('#s3').value || 0) * SLOTS.length} people across ${SLOTS.length} slots.`; cn(); $('#s3').oninput = cn;
    $('#sv').onclick = async () => {
      try { const n = await rpc('admin_set_settings', {p_pin: pin, p_settings: {event_title: $('#s1').value, event_date: $('#s2').value, slot_cap: $('#s3').value, max_per_phone: $('#s4').value, booking_open: $('#s5').value, staff_pin: $('#s6').value, admin_pin: $('#s7').value}});
        st = n; pin = n.admin_pin; sessionStorage.setItem('lq_apin', pin); localStorage.removeItem('lq_info'); $('#msg').innerHTML = '<div class="okbox">Saved.</div>'; }
      catch (e) { $('#msg').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; } };
  }
  function paint() { tabs(); if (tab === 'dash') dash(); else if (tab === 'list') bookings(); else settings(); }
  paint();
  iv = setInterval(async () => { if (tab === 'dash') { try { await load(); dash(); } catch (_) {} } }, 10000);
  cleanup = () => clearInterval(iv);
}

route();
</script>
</body>
</html>
